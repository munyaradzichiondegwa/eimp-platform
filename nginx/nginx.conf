# ============================================================
# EBA EIMP — Nginx Reverse Proxy Configuration
# Production: HTTPS with SSL termination
# Prepared by NevTech Consultancy | Ref: NTC/EBA/2026/002
# ============================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log main;

    # Performance
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 50M;      # Allow document uploads
    server_tokens      off;        # Hide Nginx version

    # Gzip compression
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=100r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream services (Docker internal network names)
    upstream backend {
        server eimp-backend:3001;
        keepalive 32;
    }

    upstream frontend {
        server eimp-frontend:3000;
        keepalive 16;
    }

    upstream customer_portal {
        server eimp-customer-portal:3002;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Allow ACME challenges for Let's Encrypt renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS: Staff Admin Portal & API ─────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name portal.ebamicroinsurance.co.zw
                    admin.ebamicroinsurance.co.zw
                    api.ebamicroinsurance.co.zw;

        # SSL certificates (Let's Encrypt or commercial CA)
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Modern SSL configuration (Mozilla Intermediate)
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # HSTS (6 months)
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

        # Security headers
        add_header X-Frame-Options          "DENY"                            always;
        add_header X-Content-Type-Options   "nosniff"                         always;
        add_header X-XSS-Protection         "1; mode=block"                   always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.ebamicroinsurance.co.zw;" always;

        # ── API routes → Backend ──────────────────────────────────────────

        # Auth endpoints — stricter rate limiting (10 req/min)
        location /api/v1/auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params;
        }

        # Payment webhooks — separate zone (mobile money providers send bursts)
        location /api/v1/payments/webhook/ {
            limit_req zone=webhook_limit burst=50 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params;
        }

        # All other API routes
        location /api/v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            limit_conn conn_limit 20;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params;
        }

        # Health check — no rate limit
        location /health {
            proxy_pass http://backend;
            include /etc/nginx/proxy_params;
            access_log off;
        }

        # ── Staff Admin Portal (Next.js) ────────────────────────────────────

        # Static assets — long cache
        location /_next/static/ {
            proxy_pass http://frontend;
            include /etc/nginx/proxy_params;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Everything else → Next.js admin frontend
        location / {
            proxy_pass http://frontend;
            include /etc/nginx/proxy_params;
        }

        # ── Error pages ────────────────────────────────────────────────────
        error_page 429 /429.html;
        location = /429.html {
            return 429 '{"type":"rate_limit","title":"Too Many Requests","status":429,"detail":"Rate limit exceeded. Please retry after a moment."}';
            add_header Content-Type application/json always;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            return 503 '{"type":"service_unavailable","title":"Service Unavailable","status":503,"detail":"The service is temporarily unavailable. Please retry shortly."}';
            add_header Content-Type application/json always;
        }
    }

    # ── HTTPS: Customer Self-Service Portal (PWA) ───────────────────────────
    server {
        listen 443 ssl http2;
        server_name my.ebamicroinsurance.co.zw;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
        add_header X-Frame-Options          "DENY"                            always;
        add_header X-Content-Type-Options   "nosniff"                         always;
        add_header X-XSS-Protection         "1; mode=block"                   always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
        # Slightly relaxed connect-src to allow the PWA service worker's API calls under the same origin
        add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.ebamicroinsurance.co.zw; manifest-src 'self'; worker-src 'self';" always;

        # API routes proxy straight through to the same backend — the portal's
        # own JWTs are role-scoped to UserRole.CUSTOMER server-side, so no
        # separate rate-limit zone is needed beyond the shared api_limit.
        location /api/v1/auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/auth/register-customer {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params;
        }

        location /api/v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;
            limit_conn conn_limit 20;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params;
        }

        # Service worker must never be cached by the proxy — same rule as next.config.js
        location = /sw.js {
            proxy_pass http://customer_portal;
            include /etc/nginx/proxy_params;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            access_log off;
        }

        location /_next/static/ {
            proxy_pass http://customer_portal;
            include /etc/nginx/proxy_params;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location / {
            proxy_pass http://customer_portal;
            include /etc/nginx/proxy_params;
        }

        error_page 429 /429.html;
        location = /429.html {
            return 429 '{"type":"rate_limit","title":"Too Many Requests","status":429,"detail":"Rate limit exceeded. Please retry after a moment."}';
            add_header Content-Type application/json always;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            return 503 '{"type":"service_unavailable","title":"Service Unavailable","status":503,"detail":"The service is temporarily unavailable. Please retry shortly."}';
            add_header Content-Type application/json always;
        }
    }
}
