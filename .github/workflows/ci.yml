name: EIMP CI

# Runs the same checks that were verified locally throughout development:
# type-check, production build, and (backend only) the unit test suite plus
# a real migration run against a disposable Postgres service container.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eimp_user
          POSTGRES_PASSWORD: eimp_ci_password
          POSTGRES_DB: eimp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test -- --ci --coverage

      - name: Build (production)
        run: npm run build

      - name: Verify migrations apply cleanly to a fresh database
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: eimp_user
          DB_PASSWORD: eimp_ci_password
          DB_NAME: eimp_db
          NODE_ENV: production
        run: npm run migration:run:prod

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 14

  frontend:
    name: Staff Admin Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build (production)
        run: npm run build

  customer-portal:
    name: Customer Portal PWA (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./customer-portal

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: customer-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build (production)
        run: npm run build
